# TrioCraft Brands Ltd — Nginx reverse proxy
#
# Routes one public domain to two internal services running on the same
# VPS (see README-DEPLOY.md for the full picture):
#   - Next.js frontend  (web/)    → 127.0.0.1:3000  (everything by default)
#   - Express JSON API  (server/) → 127.0.0.1:4000  (/api/* and /uploads/*)
# This same-origin setup is WHY the session cookie and client-side fetches
# work with zero CORS config in production — see web/lib/api.js.
#
# Domain: triocraft.org (apex + www — see README-DEPLOY.md for the DNS
# change this depends on: @ must A-record to this server's IP).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/triocraft
#   sudo ln -s /etc/nginx/sites-available/triocraft /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a certificate (do this AFTER the HTTP block above is live and
# `nginx -t` passes — certbot edits this file in place to add the HTTPS
# server block with the correct cert paths; don't hand-write that part):
#   sudo certbot --nginx -d triocraft.org -d www.triocraft.org

server {
    listen 80;
    listen [::]:80;
    server_name triocraft.org www.triocraft.org;

    # M-Pesa Daraja callbacks, LPO document uploads, and Brand Vault file
    # uploads can be several MB — keep this comfortably above multer's
    # largest configured limit (15MB; see server/routes/marketplace.js).
    client_max_body_size 20m;

    access_log /var/log/nginx/triocraft.access.log;
    error_log  /var/log/nginx/triocraft.error.log;

    # Express JSON API — every route is namespaced under /api (see
    # server/server.js). Proxied as-is, no path rewrite.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Brand Vault uploads, LPO documents, and mockup-editor preview images —
    # served statically by Express (`app.use('/uploads', express.static(...))`
    # in server/server.js).
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the Next.js app: marketing pages, marketplace,
    # client/vendor/admin dashboards, and its own /_next/static assets and
    # /img/* public files.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
